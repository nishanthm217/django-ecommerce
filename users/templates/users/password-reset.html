{% extends 'ecomApp/base.html' %}
{% block body %}
<h1>Reset your Password here!</h1>
<form method='POST'>
    {% csrf_token %}
    <label for="">Forget your password? Enter your email below please</label>
    <input type='email' name='email'>
    <button type='submit'>Reset your password</button>
</form>
{% endblock %}
